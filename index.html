<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokoLoko</title>
<style>
:root{font-family:Inter,Segoe UI,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;user-select:none}button{font:inherit}#pet-view{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}#pet{position:relative;width:128px;height:128px;display:flex;align-items:flex-end;justify-content:center;cursor:grab;transform-origin:50% 100%}#pet.dragging{cursor:grabbing;animation:dangle .35s ease-in-out infinite alternate}#sprite{max-width:128px;max-height:128px;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none;filter:drop-shadow(0 5px 3px #0004)}#bubble{position:absolute;right:0;top:2px;padding:5px 8px;border-radius:14px;background:#fff;color:#4a2b39;font-weight:900;opacity:0;transform:scale(.8);transition:.15s}#bubble.show{opacity:1;transform:none}@keyframes dangle{to{transform:rotate(5deg) translateY(4px)}}#settings-view{display:none;width:100%;height:100%;padding:28px;background:radial-gradient(circle at 20% 0,#4b2c45,#211820 42%,#121015);color:#fff8fc}h1{font-size:32px;margin:0 0 6px}p{margin:0 0 22px;color:#d6c3d0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pet-card{border:1px solid #684d60;background:#ffffff0a;color:#fff;border-radius:18px;padding:16px;text-align:left;cursor:pointer}.pet-card.selected{background:#75405f;border-color:#ffc2dc;box-shadow:0 0 0 2px #ffc2dc22}.pet-card strong{display:block;font-size:21px;margin-bottom:5px}.preview{height:72px;display:flex;align-items:center;justify-content:center}.preview img{height:68px;image-rendering:pixelated}.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:16px 2px;border-bottom:1px solid #ffffff18}.switch{width:52px;height:30px;border:0;border-radius:20px;background:#4b4249;padding:3px}.switch:after{content:'';display:block;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:#e984ad}.switch.on:after{transform:translateX(22px)}.hint{margin-top:18px;color:#aa98a5;font-size:12px}
</style>
</head>
<body>
<main id="pet-view"><div id="pet"><img id="sprite" alt="Desktop pet"><div id="bubble">♥</div></div></main>
<main id="settings-view"><h1>PokoLoko</h1><p>Choose who lives on your desktop.</p><div class="cards"><button class="pet-card" data-pet="poko"><div class="preview"><img id="poko-preview"></div><strong>Poko</strong><span>Playful, pink, and professionally chaotic.</span></button><button class="pet-card" data-pet="loko"><div class="preview"><img id="loko-preview"></div><strong>Loko</strong><span>Calm, cozy, and suspiciously sleepy.</span></button></div><div class="toggle-row"><span>Pause autonomous movement</span><button id="paused-toggle" class="switch"></button></div><div class="toggle-row"><span>Always on top</span><button id="top-toggle" class="switch"></button></div><div class="hint">Click for a reaction · drag to move · right-click for controls · double-click for settings</div></main>
<script src="sprites-poko-core.js"></script><script src="sprites-loko-mini.js"></script>
<script>
const api=window.pokoAPI,mode=new URLSearchParams(location.search).get('mode')||'pet',pet=document.getElementById('pet'),sprite=document.getElementById('sprite'),bubble=document.getElementById('bubble');
const manifests={poko:window.SPRITES_POKO||{},loko:window.SPRITES_LOKO||{}};let settings={pet:'poko',paused:false,alwaysOnTop:true},state='idle',frame=0,last=0,raf=0,timer=0,walkTimer=0,drag=null,clickTimer=0,clickCount=0,direction=1;
const aliases={sitting:'sit',landing:'happy'};const fps={idle:4,walk_right:9,walk_left:9,sit:4,sleeping:3,happy:8,confused:6,dragging:5,landing:10};
function framesFor(s=state){const m=manifests[settings.pet],key=aliases[s]||s;return m[key]&&m[key].length?m[key]:m.idle||[]}function play(next){state=next;frame=0;last=0;pet.classList.toggle('dragging',next==='dragging');cancelAnimationFrame(raf);const f=framesFor();if(f[0])sprite.src=f[0];raf=requestAnimationFrame(tick)}function tick(ts){const f=framesFor();if(!f.length)return;if(!last)last=ts;if(ts-last>=1000/(fps[state]||5)){frame=(frame+1)%f.length;sprite.src=f[frame];last=ts}raf=requestAnimationFrame(tick)}function say(t,d=850){bubble.textContent=t;bubble.classList.add('show');setTimeout(()=>bubble.classList.remove('show'),d)}function rand(a,b){return Math.round(a+Math.random()*(b-a))}function stop(){clearTimeout(timer);clearInterval(walkTimer)}
function choose(){stop();if(settings.paused||drag){play('idle');timer=setTimeout(choose,1000);return}const r=Math.random();if(r<.45){play('idle');timer=setTimeout(choose,rand(2200,settings.pet==='poko'?4800:7600))}else if(r<.75)walk();else if(r<.9){play('sitting');timer=setTimeout(choose,rand(2200,5000))}else{play('sleeping');say('Z z',1400);timer=setTimeout(()=>{play('idle');choose()},rand(5000,9000))}}
function walk(){direction=Math.random()>.5?1:-1;play(direction>0?'walk_right':'walk_left');const speed=settings.pet==='poko'?75:48,start=performance.now(),duration=rand(1800,4200);walkTimer=setInterval(()=>{api.moveTo(window.screenX+direction*speed/20);if(performance.now()-start>duration){clearInterval(walkTimer);choose()}},50)}function react(conf=false){stop();play(conf?'confused':'happy');say(conf?'?':'♥');setTimeout(()=>{play('idle');choose()},conf?1100:800)}
function apply(next){settings=next;const f=framesFor();if(f[0])sprite.src=f[0];document.querySelectorAll('[data-pet]').forEach(b=>b.classList.toggle('selected',b.dataset.pet===settings.pet));document.getElementById('paused-toggle')?.classList.toggle('on',settings.paused);document.getElementById('top-toggle')?.classList.toggle('on',settings.alwaysOnTop);if(mode==='pet'&&settings.paused){stop();play('idle')}}
function setupPet(){document.getElementById('settings-view').remove();pet.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.screenX,y:e.screenY,active:false};pet.setPointerCapture(e.pointerId)});pet.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.active&&Math.hypot(e.screenX-drag.x,e.screenY-drag.y)>5){drag.active=true;stop();play('dragging');api.beginDrag({x:e.screenX,y:e.screenY})}if(drag.active)api.dragTo({x:e.screenX,y:e.screenY})});pet.addEventListener('pointerup',e=>{if(!drag)return;const was=drag.active;drag=null;try{pet.releasePointerCapture(e.pointerId)}catch{}if(was){api.endDrag();return}clickCount++;clearTimeout(clickTimer);clickTimer=setTimeout(()=>{react(clickCount>=3);clickCount=0},220)});pet.addEventListener('dblclick',e=>{e.preventDefault();clearTimeout(clickTimer);clickCount=0;api.openSettings()});pet.addEventListener('contextmenu',e=>{e.preventDefault();api.showContextMenu()});api.onCommand(c=>{if(c==='dragged')play('dragging');if(c==='landing'){play('landing');setTimeout(choose,650)}});play('idle');choose()}
function setupSettings(){document.getElementById('pet-view').remove();document.getElementById('settings-view').style.display='block';document.getElementById('poko-preview').src=manifests.poko.idle[0];document.getElementById('loko-preview').src=manifests.loko.idle[0];document.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>api.setPet(b.dataset.pet));document.getElementById('paused-toggle').onclick=()=>api.setPaused(!settings.paused);document.getElementById('top-toggle').onclick=()=>api.setAlwaysOnTop(!settings.alwaysOnTop)}
api.getSettings().then(apply);api.onSettings(apply);mode==='settings'?setupSettings():setupPet();
</script>
</body></html>
